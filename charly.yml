# layer-crabbox — the Crabbox CLI candy
#
# One candy: `crabbox` installs the pinned Crabbox CLI binary and composes the
# CLI's laptop prerequisites (git/ssh/ssh-keygen/rsync/curl) from sibling
# candies instead of re-shipping them (R3). Root-entity repo (pod-openclaw
# shape): entities live at the repo root; no discover: block needed.
crabbox:
    candy:
        description: |
            The Crabbox CLI — lease, sync, run, stream, and release remote test
            execution (https://github.com/openclaw/crabbox). Installs the single
            static `crabbox` binary from the pinned GoReleaser release archive to
            /usr/local/bin/crabbox, and composes the CLI's laptop prerequisites
            instead of re-shipping them (R3): git via layer-gh, ssh/ssh-keygen via
            layer-ssh-client, plus rsync/curl packages. The observable, verifiable
            effect — the binary at a fixed path, `crabbox --version` reporting the
            pinned release, the credential-free `crabbox providers` matrix, and a
            broker-less `crabbox doctor` pass — is exactly what the plan block
            asserts; a missing download or a broken binary fails the checks.
        var:
            CRABBOX_VERSION: "0.79.0"
        require:
            - '@github.com/opencharly/layer-gh:v2026.272.0136'
            - '@github.com/opencharly/layer-ssh-client:v2026.272.0430'
        package:
            - rsync
            - curl
        alias:
            - name: crabbox
              command: crabbox
        plan:
            - run: download the pinned crabbox release archive and install the single binary to /usr/local/bin
              download: "https://github.com/openclaw/crabbox/releases/download/v${CRABBOX_VERSION}/crabbox_${CRABBOX_VERSION}_linux_${ARCH}.tar.gz"
              extract: tar.gz
              to: /usr/local/bin
              extract_include: [crabbox]
              run_as: root
            - check: the crabbox CLI binary is installed at /usr/local/bin/crabbox
              file:
                file: /usr/local/bin/crabbox
                exists: true
            - check: crabbox --version reports the pinned 0.79.0 release on stdout
              exit_status: 0
              stdout:
                - matches: "0\\.79\\.0"
              command: /usr/local/bin/crabbox --version
            - check: crabbox providers lists the credential-free local provider matrix
              exit_status: 0
              stdout:
                - contains: "local-container"
              command: /usr/local/bin/crabbox providers
            - check: crabbox doctor passes in a broker-less context (local prerequisites only)
              exit_status: 0
              command: /usr/local/bin/crabbox doctor
crabbox-skill:
    skill:
        name: crabbox-cli
        family: tools
        owner: crabbox
        triggers:
            - "crabbox CLI / crabbox binary / crabbox version / installing or verifying the CLI"
            - "composing the crabbox CLI candy into a box or choosing its provider surface"
        category: commands
